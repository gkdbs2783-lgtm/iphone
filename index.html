<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>iPhone Home Screen Mockup</title>
    <style>
      :root {
        --bg: #000000;
        --widget-white: #f3f3f3;
        --widget-weather: #4f5979;
        --widget-weather-2: #2b3349;
        --text: #161616;
        --soft-text: rgba(0, 0, 0, 0.62);
        --muted: rgba(255, 255, 255, 0.7);
        --label: rgba(255, 255, 255, 0.92);
        --dock: rgba(255, 255, 255, 0.08);
        --dock-border: rgba(255, 255, 255, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        min-height: 100vh;
        background: var(--bg);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
        color: var(--text);
      }

      body {
        display: grid;
        place-items: center;
      }

      .phone {
        position: relative;
        width: 390px;
        height: 844px;
        background: #000;
        overflow: hidden;
      }

      .status-bar {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 52px;
        z-index: 10;
      }

      .time {
        position: absolute;
        left: 26px;
        top: 12px;
        font-size: 16px;
        line-height: 1;
        font-weight: 700;
        letter-spacing: -0.04em;
        color: #f4f4f4;
      }

      .status-icons {
        position: absolute;
        right: 24px;
        top: 16px;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .signal {
        width: 18px;
        height: 11px;
        position: relative;
      }

      .signal span {
        position: absolute;
        inset: auto 0 0 0;
        height: 100%;
        border-radius: 2px;
        background: linear-gradient(to right, transparent 0 11%, #f4f4f4 11% 100%);
        opacity: 0.92;
      }

      .signal::before,
      .signal::after {
        content: "";
        position: absolute;
        bottom: 0;
        right: 0;
        border-radius: 2px;
        background: rgba(255,255,255,0.9);
      }

      .signal::before {
        width: 5px;
        height: 7px;
        transform: skewY(-20deg);
        left: 2px;
      }

      .signal::after {
        width: 8px;
        height: 9px;
        left: 10px;
      }

      .wifi {
        position: relative;
        width: 20px;
        height: 12px;
      }

      .wifi::before,
      .wifi::after {
        content: "";
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        border: 2px solid transparent;
        border-top-color: rgba(255,255,255,0.9);
        border-radius: 50%;
      }

      .wifi::before {
        width: 12px;
        height: 8px;
        top: 0;
      }

      .wifi::after {
        width: 18px;
        height: 12px;
        top: 1px;
      }

      .battery {
        position: relative;
        width: 22px;
        height: 11px;
        border-radius: 3px;
        border: 1.5px solid rgba(255,255,255,0.9);
      }

      .battery::before {
        content: "";
        position: absolute;
        right: -4px;
        top: 2px;
        width: 2px;
        height: 5px;
        border-radius: 1px;
        background: rgba(255,255,255,0.9);
      }

      .battery::after {
        content: "";
        position: absolute;
        inset: 2px;
        border-radius: 2px;
        background: rgba(255,255,255,0.9);
      }

      .home-screen {
        position: absolute;
        inset: 0;
        background: #000;
      }

      .top-row {
        position: absolute;
        top: 62px;
        left: 18px;
        right: 18px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      .widget {
        position: relative;
        border-radius: 28px;
        overflow: hidden;
        padding: 14px 18px 14px 18px;
      }

      .widget.left {
        background: var(--widget-white);
        height: 230px;
        color: var(--text);
      }

      .widget.right {
        background: linear-gradient(180deg, #484d68 0%, #3a425d 100%);
        height: 230px;
        color: #f4f5f8;
      }

      .widget-title {
        font-size: 12px;
        line-height: 1.2;
        opacity: 0.9;
      }

      .widget-title.right {
        color: rgba(255,255,255,0.92);
      }

      .temp-label {
        margin-top: 14px;
        font-size: 54px;
        line-height: 1;
        letter-spacing: -0.08em;
        font-weight: 300;
      }

      .left .temp-label {
        color: #131313;
      }

      .day-label {
        margin-top: 12px;
        font-size: 12px;
        line-height: 1.5;
        color: rgba(0,0,0,0.62);
      }

      .right .temp-label {
        font-size: 56px;
        margin-top: 2px;
      }

      .weather-grid {
        margin-top: 8px;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .weather-symbol {
        width: 26px;
        height: 26px;
        position: relative;
      }

      .weather-symbol::before {
        content: "";
        position: absolute;
        left: 5px;
        top: 10px;
        width: 18px;
        height: 10px;
        background: rgba(255,255,255,0.92);
        border-radius: 8px;
      }

      .weather-symbol::after {
        content: "";
        position: absolute;
        left: 7px;
        top: 5px;
        width: 14px;
        height: 10px;
        background: rgba(255,255,255,0.92);
        border-radius: 9px 9px 5px 5px;
      }

      .subtext {
        margin-top: 18px;
        font-size: 17px;
        line-height: 1.4;
        letter-spacing: -0.03em;
        color: rgba(255,255,255,0.9);
      }

      .forecast {
        margin-top: 14px;
        font-size: 15px;
        color: rgba(255,255,255,0.82);
      }

      .widget-labels {
        position: absolute;
        top: 300px;
        left: 18px;
        right: 18px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        font-size: 14px;
        color: rgba(255,255,255,0.78);
      }

      .widget-labels .left-label,
      .widget-labels .right-label {
        line-height: 1;
        font-weight: 400;
      }

      .widget-labels .left-label {
        color: rgba(255,255,255,0.7);
        text-align: left;
        padding-left: 10px;
      }

      .widget-labels .right-label {
        color: rgba(255,255,255,0.7);
        text-align: right;
        padding-right: 10px;
      }

      .app-grid {
        position: absolute;
        top: 334px;
        left: 18px;
        right: 18px;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 22px 10px;
        align-items: start;
      }

      .app {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }

      .app-icon {
        width: 74px;
        height: 74px;
        border-radius: 18px;
        position: relative;
        overflow: hidden;
      }

      .app-label {
        font-size: 15px;
        color: rgba(255,255,255,0.86);
        line-height: 1.2;
      }

      .icon-phone {
        background: linear-gradient(180deg, #6ad38f, #54c677 80%);
      }

      .icon-phone::before {
        content: "";
        position: absolute;
        left: 50%;
        top: 26px;
        width: 40px;
        height: 24px;
        transform: translateX(-50%);
        border-radius: 10px 10px 12px 12px;
        border: 4px solid rgba(255,255,255,0.96);
        border-bottom-width: 4px;
      }

      .icon-phone::after {
        content: "";
        position: absolute;
        left: 50%;
        top: 22px;
        width: 10px;
        height: 10px;
        transform: translateX(-50%);
        border-radius: 50%;
        background: rgba(255,255,255,0.96);
        box-shadow: 0 0 0 4px rgba(255,255,255,0.08);
      }

      .icon-photos {
        background: linear-gradient(135deg, #fef3a6, #ff8d63 20%, #ff4d7d 42%, #8644ff 72%, #5fd6ff 100%);
      }

      .icon-photos::before {
        content: "";
        position: absolute;
        inset: 16px 16px 18px 16px;
        border-radius: 16px;
        background: linear-gradient(135deg, rgba(255,255,255,0.18), rgba(255,255,255,0.08));
      }

      .icon-photos::after {
        content: "";
        position: absolute;
        right: 10px;
        bottom: 10px;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: rgba(255,255,255,0.9);
        box-shadow: -12px -10px 0 2px rgba(255,255,255,0.78), -8px -22px 0 -4px rgba(255,206,120,0.9);
      }

      .icon-memo {
        background: linear-gradient(180deg, #e8ebf1, #d2d7df);
      }

      .icon-memo::before {
        content: "";
        position: absolute;
        left: 18px;
        right: 18px;
        top: 16px;
        bottom: 16px;
        border-radius: 8px;
        background: #f9fafb;
        box-shadow: inset 0 0 0 1px rgba(0,0,0,0.08);
      }

      .icon-memo::after {
        content: "";
        position: absolute;
        left: 26px;
        top: 28px;
        width: 24px;
        height: 2px;
        background: rgba(0,0,0,0.16);
        box-shadow: 0 8px 0 rgba(0,0,0,0.16), 0 16px 0 rgba(0,0,0,0.16);
      }

      .icon-clock {
        background: linear-gradient(180deg, #f5f6f8, #dfe2e7);
      }

      .icon-clock::before {
        content: "";
        position: absolute;
        inset: 13px;
        border-radius: 50%;
        background: #f8f8f8;
        box-shadow: inset 0 0 0 2px rgba(0,0,0,0.08);
      }

      .icon-clock::after {
        content: "";
        position: absolute;
        left: 50%;
        top: 50%;
        width: 2px;
        height: 18px;
        background: #4a4d59;
        border-radius: 2px;
        transform: translate(-50%, -50%) rotate(40deg);
        transform-origin: bottom center;
        box-shadow: 0 -12px 0 -9px rgba(0,0,0,0.8);
      }

      .icon-mail {
        background: linear-gradient(180deg, #67c5ff, #3b9ff7);
      }

      .icon-mail::before {
        content: "";
        position: absolute;
        left: 12px;
        right: 12px;
        top: 18px;
        bottom: 18px;
        border-radius: 12px;
        background: #f4f7ff;
        clip-path: polygon(0 0, 100% 0, 50% 54%);
      }

      .icon-mail::after {
        content: "";
        position: absolute;
        left: 12px;
        right: 12px;
        top: 20px;
        bottom: 18px;
        border-radius: 10px;
        background: linear-gradient(180deg, #f5f8ff, #eaf2ff);
        clip-path: polygon(0 0, 100% 0, 0 100%, 0 100%);
      }

      .icon-safari {
        background: linear-gradient(180deg, #d7e5ff, #7d90ff);
      }

      .icon-safari::before {
        content: "";
        position: absolute;
        inset: 12px;
        border-radius: 50%;
        background: linear-gradient(180deg, #f8fafc, #dfe9ff);
      }

      .icon-safari::after {
        content: "";
        position: absolute;
        left: 50%;
        top: 50%;
        width: 30px;
        height: 30px;
        transform: translate(-50%, -50%);
        background: linear-gradient(180deg, #e7f4ff, #90d9ff);
        border-radius: 50%;
        box-shadow: inset 0 0 0 3px rgba(255,255,255,0.8);
      }

      .icon-settings {
        background: linear-gradient(180deg, #d7dbe1, #a2a9b4);
      }

      .icon-settings::before {
        content: "";
        position: absolute;
        left: 50%;
        top: 50%;
        width: 42px;
        height: 42px;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        border: 8px solid rgba(255,255,255,0.75);
        box-shadow: 0 0 0 8px rgba(255,255,255,0.12);
      }

      .icon-settings::after {
        content: "";
        position: absolute;
        left: 50%;
        top: 50%;
        width: 12px;
        height: 12px;
        transform: translate(-50%, -50%);
        background: rgba(255,255,255,0.82);
        border-radius: 50%;
      }

      .search-bar {
        position: absolute;
        left: 50%;
        bottom: 120px;
        transform: translateX(-50%);
        width: 190px;
        height: 40px;
        border-radius: 20px;
        background: rgba(255,255,255,0.12);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        color: rgba(255,255,255,0.84);
        font-size: 16px;
      }

      .search-glass {
        position: relative;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        border: 2px solid rgba(255,255,255,0.8);
      }

      .search-glass::after {
        content: "";
        position: absolute;
        width: 7px;
        height: 2px;
        border-radius: 2px;
        background: rgba(255,255,255,0.8);
        right: -5px;
        bottom: -1px;
        transform: rotate(45deg);
      }

      .dock {
        position: absolute;
        left: 16px;
        right: 16px;
        bottom: 14px;
        height: 92px;
        border-radius: 28px;
        background: rgba(255,255,255,0.08);
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
        display: flex;
        align-items: center;
        justify-content: space-around;
        padding: 0 12px;
      }

      .dock-app {
        width: 58px;
        height: 58px;
        border-radius: 18px;
        position: relative;
        overflow: hidden;
      }

      .dock-app.instagram {
        background: linear-gradient(135deg, #ffc75a 0%, #ff4d9d 30%, #8247ff 65%, #2f8cff 100%);
      }

      .dock-app.instagram::before {
        content: "";
        position: absolute;
        left: 50%;
        top: 50%;
        width: 24px;
        height: 24px;
        transform: translate(-50%, -50%);
        border-radius: 8px;
        border: 3px solid rgba(255,255,255,0.9);
      }

      .dock-app.instagram::after {
        content: "";
        position: absolute;
        left: 50%;
        top: 50%;
        width: 8px;
        height: 8px;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        background: rgba(255,255,255,0.9);
        box-shadow: -10px -11px 0 0 rgba(255,255,255,0.9), 10px -11px 0 0 rgba(255,255,255,0.9);
      }

      .dock-app.talk {
        background: #f9f4e8;
      }

      .dock-app.talk::before {
        content: "TALK";
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        font-size: 16px;
        font-weight: 700;
        letter-spacing: -0.04em;
        color: #1d1d1d;
      }

      .dock-app.youtube {
        background: #f5f5f5;
      }

      .dock-app.youtube::before {
        content: "";
        position: absolute;
        left: 50%;
        top: 50%;
        width: 0;
        height: 0;
        transform: translate(-50%, -50%);
        border-left: 14px solid #ff2c2c;
        border-top: 9px solid transparent;
        border-bottom: 9px solid transparent;
      }

      .dock-app.x {
        background: #111111;
      }

      .dock-app.x::before,
      .dock-app.x::after {
        content: "";
        position: absolute;
        left: 50%;
        top: 50%;
        width: 28px;
        height: 3px;
        background: rgba(255,255,255,0.9);
        border-radius: 3px;
      }

      .dock-app.x::before {
        transform: translate(-50%, -50%) rotate(45deg);
      }

      .dock-app.x::after {
        transform: translate(-50%, -50%) rotate(-45deg);
      }

      .home-indicator {
        position: absolute;
        bottom: 9px;
        left: 50%;
        transform: translateX(-50%);
        width: 124px;
        height: 4px;
        border-radius: 999px;
        background: rgba(255,255,255,0.85);
      }

      @media (max-width: 420px) {
        .phone {
          width: 100vw;
          height: 100vh;
        }
      }
    </style>
  </head>
  <body>
    <div class="phone">
      <div class="status-bar">
        <div class="time">9:46</div>
        <div class="status-icons">
          <div class="signal" aria-hidden="true"></div>
          <div class="wifi" aria-hidden="true"></div>
          <div class="battery" aria-hidden="true"></div>
        </div>
      </div>

      <div class="home-screen" aria-label="홈 화면">
        <div class="top-row">
          <div class="widget left">
            <div class="widget-title">일요일</div>
            <div class="temp-label">25</div>
            <div class="day-label">오늘 이벤트 없음</div>
          </div>

          <div class="widget right">
            <div class="widget-title right">화성시</div>
            <div class="temp-label">17°</div>
            <div class="weather-grid">
              <div class="weather-symbol" aria-hidden="true"></div>
            </div>
            <div class="subtext">부분적으로 흐림</div>
            <div class="forecast">최고:23° 최저:12°</div>
          </div>
        </div>

        <div class="widget-labels">
          <div class="left-label">캘린더</div>
          <div class="right-label">날씨</div>
        </div>

        <div class="app-grid">
          <div class="app">
            <div class="app-icon icon-phone"></div>
            <div class="app-label">전화</div>
          </div>
          <div class="app">
            <div class="app-icon icon-photos"></div>
            <div class="app-label">사진</div>
          </div>
          <div class="app">
            <div class="app-icon icon-memo"></div>
            <div class="app-label">메모</div>
          </div>
          <div class="app">
            <div class="app-icon icon-clock"></div>
            <div class="app-label">시계</div>
          </div>
          <div class="app">
            <div class="app-icon icon-mail"></div>
            <div class="app-label">Mail</div>
          </div>
          <div class="app">
            <div class="app-icon icon-safari"></div>
            <div class="app-label">Safari</div>
          </div>
          <div class="app">
            <div class="app-icon icon-settings"></div>
            <div class="app-label">설정</div>
          </div>
        </div>

        <div class="search-bar" aria-label="검색">
          <div class="search-glass" aria-hidden="true"></div>
          <span>검색</span>
        </div>

        <div class="dock" aria-label="독">
          <div class="dock-app instagram"></div>
          <div class="dock-app talk"></div>
          <div class="dock-app youtube"></div>
          <div class="dock-app x"></div>
        </div>

        <div class="home-indicator" aria-hidden="true"></div>
      </div>
    </div>
  </body>
</html>
