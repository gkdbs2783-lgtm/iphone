<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>iPhone Lock Screen Mockup</title>
    <style>
      :root {
        --bg: #000000;
        --phone-frame: #1a1a1a;
        --phone-shadow: rgba(0, 0, 0, 0.18);
        --screen-bg: #000000;
        --glass: rgba(255, 255, 255, 0.08);
        --text: #f5f5f5;
        --muted: rgba(255,255,255,0.68);
        --line: rgba(255,255,255,0.18);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        width: 100%;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
      }

      body {
        display: grid;
        place-items: center;
        overflow: hidden;
      }

      .phone-shell {
        width: min(82vw, 340px);
        height: min(92vh, 700px);
        padding: 12px 12px 16px;
        border-radius: 38px;
        background: linear-gradient(145deg, #f4f4f4, #d8d8d8 45%, #f3f3f3 100%);
        box-shadow: 0 24px 60px rgba(0,0,0,0.18), inset 0 0 0 2px rgba(0,0,0,0.08);
        position: relative;
      }

      .phone-shell::before {
        content: "";
        position: absolute;
        inset: 8px 8px auto 8px;
        height: 22px;
        border-radius: 16px;
        background: rgba(0,0,0,0.18);
        filter: blur(8px);
      }

      .phone {
        position: relative;
        width: 100%;
        height: 100%;
        border-radius: 32px;
        overflow: hidden;
        background: var(--screen-bg);
        border: 1px solid rgba(255,255,255,0.2);
      }

      .screen {
        position: relative;
        z-index: 1;
        width: 100%;
        height: 100%;
        background: #000;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        padding: 18px 18px 20px;
      }

      .status-bar {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 42px;
        z-index: 60;
        pointer-events: none;
      }

      .dynamic-island {
        position: absolute;
        left: 50%;
        top: 8px;
        transform: translateX(-50%);
        width: 122px;
        height: 28px;
        border-radius: 999px;
        background: rgba(0,0,0,0.9);
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06);
        z-index: 65;
      }

      .status-cluster {
        position: absolute;
        top: 15px;
        left: calc(50% + 72px);
        display: flex;
        align-items: center;
        gap: 6px;
        z-index: 66;
      }

      .status-dot {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: #37d67a;
        box-shadow: 0 0 0 1px rgba(0,0,0,0.18);
      }

      .battery {
        width: 18px;
        height: 9px;
        border-radius: 3px;
        border: 1.5px solid rgba(255,255,255,0.9);
        position: relative;
        background: transparent;
      }

      .battery::before {
        content: "";
        position: absolute;
        right: -4px;
        top: 1px;
        width: 2px;
        height: 5px;
        background: rgba(255,255,255,0.9);
        border-radius: 2px;
      }

      .battery::after {
        content: "";
        position: absolute;
        inset: 2px;
        background: rgba(255,255,255,0.92);
        border-radius: 2px;
      }

      .notch {
        position: absolute;
        top: 8px;
        left: 50%;
        transform: translateX(-50%);
        width: 132px;
        height: 26px;
        border-radius: 18px;
        background: rgba(0,0,0,0.9);
        z-index: 20;
      }

      .notch::before {
        content: "";
        position: absolute;
        inset: 8px 52px 8px 52px;
        border-radius: 8px;
        background: rgba(20,20,20,0.9);
      }

      .lock-screen {
        position: absolute;
        inset: 0;
        z-index: 40;
        background: #000;
        padding: 58px 26px 36px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        transition: opacity 0.7s ease, visibility 0.7s ease, transform 0.7s cubic-bezier(0.2, 0.8, 0.2, 1), filter 0.7s ease;
      }

      .lock-screen::before {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 20% 20%, rgba(255,255,255,0.08), transparent 28%),
                    radial-gradient(circle at 80% 25%, rgba(255,255,255,0.06), transparent 24%),
                    linear-gradient(180deg, rgba(255,255,255,0.02), rgba(0,0,0,0.12));
      }

      .lock-screen.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transform: translateY(-18%) scale(0.96);
        filter: blur(12px);
      }

      .lock-screen.passcode-visible .swipe-zone {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .lock-top {
        text-align: center;
        margin-top: 8px;
        position: relative;
        z-index: 1;
      }

      .lock-time {
        font-size: 62px;
        font-weight: 300;
        letter-spacing: -0.08em;
        line-height: 1;
        color: #fff;
      }

      .lock-date {
        margin-top: 10px;
        color: rgba(255,255,255,0.72);
        font-size: 14px;
      }

      .swipe-zone {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 90px;
        user-select: none;
        transition: opacity 0.2s ease, visibility 0.2s ease;
        position: relative;
        z-index: 1;
      }

      .swipe-indicator {
        width: 120px;
        height: 6px;
        border-radius: 999px;
        background: rgba(255,255,255,1);
        position: relative;
        overflow: hidden;
      }

      .swipe-indicator::before {
        content: "";
        position: absolute;
        inset: 0;
        width: 100%;
        background: rgba(255,255,255,1);
      }

      .passcode-panel {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        width: 250px;
        bottom: 34px;
        background: transparent;
        border: none;
        border-radius: 0;
        backdrop-filter: none;
        padding: 0;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.25s ease, transform 0.25s ease, visibility 0.25s ease;
        z-index: 1;
      }

      .passcode-panel.visible {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
        visibility: visible;
      }

      .passcode-label {
        font-size: 12px;
        letter-spacing: 0.16em;
        font-weight: 500;
        color: rgba(255,255,255,0.72);
        text-align: center;
        text-transform: uppercase;
        margin-bottom: 12px;
      }

      .passcode-dot-row {
        display: flex;
        justify-content: center;
        gap: 12px;
        margin: 0 0 20px;
      }

      .pin-dot {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: rgba(255,255,255,0.18);
        border: 1px solid rgba(255,255,255,0.12);
        transition: background 0.15s ease, transform 0.15s ease;
      }

      .pin-dot.filled {
        background: rgba(255,255,255,0.96);
        transform: scale(1.09);
      }

      .keypad {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px 16px;
        justify-items: center;
        align-content: center;
      }

      .key {
        appearance: none;
        border: 0;
        width: 66px;
        height: 66px;
        border-radius: 50%;
        background: rgba(255,255,255,0.06);
        color: #fff;
        font-size: 20px;
        font-weight: 500;
        cursor: pointer;
        display: grid;
        place-items: center;
      }

      .key:active {
        transform: scale(0.98);
      }

      .key.action {
        background: rgba(255,255,255,0.12);
        font-size: 12px;
        letter-spacing: 0.03em;
      }

      .key.spacer {
        visibility: hidden;
        pointer-events: none;
      }

      .home-screen {
        position: absolute;
        inset: 0;
        z-index: 10;
        background: linear-gradient(180deg, #0f172a 0%, #0b1018 100%);
        opacity: 0;
        visibility: hidden;
        transform: translateY(56px) scale(0.98);
        filter: blur(12px);
        transition: transform 0.7s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.65s ease, visibility 0.65s ease, filter 0.7s ease;
      }

      .home-screen::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          radial-gradient(circle at 20% 20%, rgba(255,255,255,0.08), transparent 28%),
          radial-gradient(circle at 80% 25%, rgba(148,163,184,0.08), transparent 24%),
          linear-gradient(180deg, rgba(255,255,255,0.02), rgba(0,0,0,0.06));
      }

      .home-screen.visible {
        opacity: 1;
        visibility: visible;
        transform: translateY(0) scale(1);
        filter: blur(0);
      }

      .home-content {
        position: absolute;
        inset: 96px 16px 116px;
        z-index: 1;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .widget {
        position: relative;
        border-radius: 22px;
        background: rgba(255,255,255,0.12);
        border: 1px solid rgba(255,255,255,0.12);
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.12), 0 10px 30px rgba(0,0,0,0.18);
        backdrop-filter: blur(10px);
        overflow: hidden;
        width: 100%;
        aspect-ratio: 1 / 1;
        padding: 12px 10px 10px;
      }

      .widget-calendar {
        display: flex;
        flex-direction: column;
      }

      .widget-weather {
        background: linear-gradient(145deg, rgba(79,140,255,0.38), rgba(17,24,39,0.6));
        display: flex;
        flex-direction: column;
      }

      .widget-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 10px;
        font-size: 10px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: rgba(255,255,255,0.76);
      }

      .widget-pill {
        padding: 4px 8px;
        border-radius: 999px;
        background: rgba(255,255,255,0.12);
      }

      .calendar-today {
        display: grid;
        grid-template-columns: auto auto auto;
        align-items: end;
        justify-content: center;
        gap: 6px 8px;
        margin-top: 8px;
        margin-bottom: 14px;
        color: rgba(255,255,255,0.9);
      }

      .today-weekday {
        font-size: 10px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        opacity: 0.8;
        margin-bottom: 4px;
      }

      .today-date {
        font-size: 42px;
        line-height: 1;
        font-weight: 700;
        letter-spacing: -0.08em;
      }

      .today-month {
        font-size: 12px;
        opacity: 0.8;
        margin-bottom: 6px;
      }

      .todo-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-top: auto;
        padding: 0 2px;
      }

      .todo-item {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 7px 8px;
        border-radius: 10px;
        background: rgba(255,255,255,0.06);
        color: rgba(255,255,255,0.9);
        font-size: 10px;
      }

      .todo-item.done {
        opacity: 0.7;
      }

      .todo-item.done span:last-child {
        text-decoration: line-through;
      }

      .todo-bullet {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: rgba(255,255,255,0.9);
        flex-shrink: 0;
      }

      .todo-item.done .todo-bullet {
        background: rgba(255,255,255,0.45);
      }

      .weather-main {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 8px;
      }

      .weather-temp {
        font-size: 34px;
        font-weight: 300;
        letter-spacing: -0.06em;
        line-height: 1;
      }

      .weather-icon {
        font-size: 24px;
        filter: drop-shadow(0 0 18px rgba(255,255,255,0.22));
      }

      .weather-meta {
        display: flex;
        justify-content: space-between;
        font-size: 10px;
        color: rgba(255,255,255,0.78);
        margin-bottom: 10px;
      }

      .forecast-row {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 8px;
      }

      .forecast-slot {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        padding: 6px 4px;
        border-radius: 12px;
        background: rgba(255,255,255,0.08);
        font-size: 9px;
        color: rgba(255,255,255,0.8);
      }

      .forecast-slot strong {
        font-size: 12px;
        color: white;
      }

      .home-app-grid {
        position: absolute;
        left: 18px;
        right: 18px;
        bottom: 62px;
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 12px 10px;
        z-index: 1;
      }

      .app-icon {
        position: relative;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        height: 58px;
        border-radius: 18px;
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.22);
        overflow: hidden;
      }

      .app-icon::before {
        content: "";
        position: absolute;
        inset: 10px 10px auto 10px;
        height: 22px;
        border-radius: 8px;
        background: rgba(255,255,255,0.12);
      }

      .app-icon span {
        position: relative;
        z-index: 1;
        margin-bottom: 8px;
        font-size: 9px;
        line-height: 1.2;
        text-align: center;
        color: rgba(255,255,255,0.96);
        text-shadow: 0 1px 2px rgba(0,0,0,0.3);
        max-width: 90%;
      }

      .memo { background: linear-gradient(180deg, #d5d7dc 0%, #afb5c0 100%); }
      .calendar { background: linear-gradient(180deg, #f7d98e 0%, #eb8d5b 100%); }
      .browser { background: linear-gradient(180deg, #59d3ff 0%, #2b7fff 100%); }
      .contacts { background: linear-gradient(180deg, #76d0a2 0%, #2ea873 100%); }
      .instagram { background: linear-gradient(135deg, #ffdd55 0%, #ff5e7d 26%, #7c3aed 66%, #2cc5ff 100%); }

      .home-dock {
        position: absolute;
        left: 12px;
        right: 12px;
        bottom: 16px;
        height: 52px;
        border-radius: 18px;
        background: rgba(255,255,255,0.12);
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.18);
        z-index: 1;
      }

      .unlock-success {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 18px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.35s ease, visibility 0.35s ease;
        background: rgba(255,255,255,0.03);
      }

      .unlock-success.visible {
        opacity: 1;
        visibility: visible;
      }

      .home-indicator {
        position: absolute;
        bottom: 8px;
        left: 50%;
        transform: translateX(-50%);
        width: 120px;
        height: 4px;
        border-radius: 999px;
        background: rgba(255,255,255,0.9);
        z-index: 30;
      }

      @media (max-width: 420px) {
        .phone-shell {
          width: 100vw;
          height: 100vh;
          border-radius: 0;
          padding: 0;
          background: #000;
        }

        .phone {
          border-radius: 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="phone-shell">
      <div class="phone">
        <div class="notch"></div>

        <div class="status-bar" aria-hidden="true">
          <div class="dynamic-island"></div>
          <div class="status-cluster">
            <span class="status-dot"></span>
            <span class="battery" aria-label="배터리"></span>
          </div>
        </div>

        <div class="screen"></div>

        <div class="home-screen" id="homeScreen">
          <div class="home-content">
            <div class="widget widget-calendar">
              <div class="widget-header">
                <span>Today</span>
                <span class="widget-pill">Tasks</span>
              </div>

              <div class="calendar-today">
                <div class="today-weekday" id="calendarWeekday">금요일</div>
                <div class="today-date" id="calendarDate">30</div>
                <div class="today-month" id="calendarMonth">12월</div>
              </div>

              <div class="todo-list">
                <div class="todo-item"><span class="todo-bullet"></span><span>디자인 리뷰</span></div>
                <div class="todo-item done"><span class="todo-bullet"></span><span>팀 회의</span></div>
                <div class="todo-item"><span class="todo-bullet"></span><span>프로젝트 정리</span></div>
              </div>
            </div>

            <div class="widget widget-weather">
              <div class="widget-header">
                <span>Weather</span>
                <span class="widget-pill">Seoul</span>
              </div>

              <div class="weather-main">
                <div class="weather-temp">23°</div>
                <div class="weather-icon">☀️</div>
              </div>

              <div class="weather-meta">
                <span>맑음</span>
                <span>12km/h</span>
              </div>

              <div class="forecast-row">
                <div class="forecast-slot"><span>오후</span><strong>27°</strong></div>
                <div class="forecast-slot"><span>저녁</span><strong>22°</strong></div>
                <div class="forecast-slot"><span>내일</span><strong>24°</strong></div>
                <div class="forecast-slot"><span>월</span><strong>21°</strong></div>
              </div>
            </div>
          </div>

          <div class="home-app-grid">
            <div class="app-icon memo"><span>메모</span></div>
            <div class="app-icon calendar"><span>캘린더</span></div>
            <div class="app-icon browser"><span>인터넷</span></div>
            <div class="app-icon contacts"><span>연락처</span></div>
            <div class="app-icon instagram"><span>인스타</span></div>
          </div>
          <div class="home-dock"></div>
        </div>

        <div class="lock-screen" id="lockScreen">
          <div class="lock-top">
            <div class="lock-time" id="time">9:41</div>
            <div class="lock-date" id="lockDate">금요일, 12월 30일</div>
          </div>

          <div class="swipe-zone" id="swipeZone">
            <div class="swipe-indicator"></div>
          </div>

          <div class="passcode-panel" id="passcodePanel">
            <div class="passcode-label">암호 입력</div>
            <div class="passcode-dot-row" id="passcodeDots"></div>
            <div class="keypad">
              <button class="key" type="button">1</button>
              <button class="key" type="button">2</button>
              <button class="key" type="button">3</button>
              <button class="key" type="button">4</button>
              <button class="key" type="button">5</button>
              <button class="key" type="button">6</button>
              <button class="key" type="button">7</button>
              <button class="key" type="button">8</button>
              <button class="key" type="button">9</button>
              <button class="key action" type="button" id="clearPasscode">삭제</button>
              <button class="key" type="button">0</button>
              <div class="key spacer" aria-hidden="true"></div>
            </div>
          </div>

          <div class="unlock-success" id="unlockSuccess">Unlocked</div>
        </div>

        <div class="home-indicator"></div>
      </div>
    </div>

    <script>
      const timeEl = document.getElementById('time');
      const lockDateEl = document.getElementById('lockDate');
      const weekdayEl = document.getElementById('calendarWeekday');
      const dateEl = document.getElementById('calendarDate');
      const monthEl = document.getElementById('calendarMonth');

      const updateDateDisplay = () => {
        const now = new Date();
        const weekday = ['일요일', '월요일', '화요일', '수요일', '목요일', '금요일', '토요일'][now.getDay()];
        const month = now.getMonth() + 1;
        const day = now.getDate();

        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        timeEl.textContent = `${hours}:${minutes}`;

        lockDateEl.textContent = `${weekday}, ${month}월 ${day}일`;
        weekdayEl.textContent = weekday;
        dateEl.textContent = String(day);
        monthEl.textContent = `${month}월`;
      };

      updateDateDisplay();
      setInterval(updateDateDisplay, 30000);

      const lockScreen = document.getElementById('lockScreen');
      const passcodePanel = document.getElementById('passcodePanel');
      const passcodeDots = document.getElementById('passcodeDots');
      const unlockSuccess = document.getElementById('unlockSuccess');
      const swipeZone = document.getElementById('swipeZone');
      const homeScreen = document.getElementById('homeScreen');
      const keypadButtons = Array.from(document.querySelectorAll('.key'));
      let enteredCode = '';
      let touchStartY = 0;
      let swipeActive = false;

      const renderDots = () => {
        passcodeDots.innerHTML = '';
        for (let i = 0; i < 4; i += 1) {
          const dot = document.createElement('span');
          dot.className = 'pin-dot' + (i < enteredCode.length ? ' filled' : '');
          passcodeDots.appendChild(dot);
        }
      };

      const showPasscode = () => {
        passcodePanel.classList.add('visible');
        lockScreen.classList.add('passcode-visible');
      };

      const hidePasscode = () => {
        passcodePanel.classList.remove('visible');
        lockScreen.classList.remove('passcode-visible');
      };

      const unlockPhone = () => {
        hidePasscode();
        lockScreen.classList.add('hidden');
        homeScreen.classList.add('visible');
      };

      const resetPasscode = () => {
        enteredCode = '';
        renderDots();
      };

      const handleNumberInput = (value) => {
        if (enteredCode.length >= 4) return;
        enteredCode += value;
        renderDots();

        if (enteredCode.length === 4) {
          setTimeout(() => {
            unlockPhone();
            resetPasscode();
          }, 180);
        }
      };

      keypadButtons.forEach((button) => {
        const value = button.textContent.trim();

        if (button.id === 'clearPasscode') {
          button.addEventListener('click', () => {
            enteredCode = enteredCode.slice(0, -1);
            renderDots();
          });
          return;
        }

        if (button.classList.contains('spacer')) {
          return;
        }

        if (/^[0-9]$/.test(value)) {
          button.addEventListener('click', () => handleNumberInput(value));
        }
      });

      swipeZone.addEventListener('touchstart', (event) => {
        touchStartY = event.touches[0].clientY;
        swipeActive = true;
      }, { passive: true });

      swipeZone.addEventListener('touchmove', (event) => {
        if (!swipeActive) return;
        const deltaY = touchStartY - event.touches[0].clientY;
        if (deltaY > 40) {
          showPasscode();
          swipeActive = false;
        }
      }, { passive: true });

      swipeZone.addEventListener('mousedown', (event) => {
        touchStartY = event.clientY;
        swipeActive = true;
      });

      swipeZone.addEventListener('mousemove', (event) => {
        if (!swipeActive) return;
        const deltaY = touchStartY - event.clientY;
        if (deltaY > 40) {
          showPasscode();
          swipeActive = false;
        }
      });

      swipeZone.addEventListener('mouseup', () => {
        swipeActive = false;
      });

      swipeZone.addEventListener('mouseleave', () => {
        swipeActive = false;
      });

      renderDots();
    </script>
  </body>
</html>
