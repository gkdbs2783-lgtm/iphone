<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>iPhone Lock Screen Mockup</title>
    <style>
      :root {
        --bg: #f6f6f6;
        --phone-frame: #1a1a1a;
        --phone-shadow: rgba(0, 0, 0, 0.18);
        --screen-bg: #000000;
        --glass: rgba(255, 255, 255, 0.08);
        --text: #f5f5f5;
        --muted: rgba(255,255,255,0.68);
        --line: rgba(255,255,255,0.18);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        width: 100%;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
      }

      body {
        display: grid;
        place-items: center;
        overflow: hidden;
      }

      .phone-shell {
        width: min(82vw, 340px);
        height: min(92vh, 700px);
        padding: 12px 12px 16px;
        border-radius: 38px;
        background: linear-gradient(145deg, #f4f4f4, #d8d8d8 45%, #f3f3f3 100%);
        box-shadow: 0 24px 60px rgba(0,0,0,0.18), inset 0 0 0 2px rgba(0,0,0,0.08);
        position: relative;
      }

      .phone-shell::before {
        content: "";
        position: absolute;
        inset: 8px 8px auto 8px;
        height: 22px;
        border-radius: 16px;
        background: rgba(0,0,0,0.18);
        filter: blur(8px);
      }

      .phone {
        position: relative;
        width: 100%;
        height: 100%;
        border-radius: 32px;
        overflow: hidden;
        background: var(--screen-bg);
        border: 1px solid rgba(255,255,255,0.2);
      }

      .screen {
        position: relative;
        z-index: 1;
        width: 100%;
        height: 100%;
        background: #000;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        padding: 18px 18px 20px;
      }

      .status-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 12px;
        font-weight: 600;
        color: rgba(255,255,255,0.9);
        padding: 0 8px 6px;
      }

      .status-icons {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .signal {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: rgba(255,255,255,0.95);
      }

      .wifi {
        width: 14px;
        height: 10px;
        position: relative;
      }

      .wifi::before,
      .wifi::after,
      .wifi span {
        content: "";
        position: absolute;
        inset: 0;
        border: 2px solid rgba(255,255,255,0.9);
        border-color: rgba(255,255,255,0.9) transparent transparent transparent;
        border-radius: 50%;
      }

      .wifi::before { transform: scale(0.65); }
      .wifi::after { transform: scale(0.35); }
      .wifi span { transform: scale(0.15); }

      .battery {
        width: 20px;
        height: 10px;
        border-radius: 3px;
        border: 1.5px solid rgba(255,255,255,0.9);
        position: relative;
      }

      .battery::before {
        content: "";
        position: absolute;
        right: -4px;
        top: 2px;
        width: 2px;
        height: 5px;
        background: rgba(255,255,255,0.9);
        border-radius: 2px;
      }

      .battery::after {
        content: "";
        position: absolute;
        inset: 2px;
        background: rgba(255,255,255,0.92);
        border-radius: 2px;
      }

      .notch {
        position: absolute;
        top: 8px;
        left: 50%;
        transform: translateX(-50%);
        width: 132px;
        height: 26px;
        border-radius: 18px;
        background: rgba(0,0,0,0.9);
        z-index: 20;
      }

      .notch::before {
        content: "";
        position: absolute;
        inset: 8px 52px 8px 52px;
        border-radius: 8px;
        background: rgba(20,20,20,0.9);
      }

      .lock-screen {
        position: absolute;
        inset: 0;
        z-index: 40;
        background: #000;
        padding: 58px 26px 36px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        transition: opacity 0.3s ease, visibility 0.3s ease, transform 0.5s ease;
      }

      .lock-screen.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transform: translateY(-100%);
      }

      .lock-screen.passcode-visible .swipe-zone {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .lock-top {
        text-align: center;
        margin-top: 8px;
      }

      .lock-time {
        font-size: 62px;
        font-weight: 300;
        letter-spacing: -0.08em;
        line-height: 1;
        color: #fff;
      }

      .lock-date {
        margin-top: 10px;
        color: rgba(255,255,255,0.72);
        font-size: 14px;
      }

      .swipe-zone {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 90px;
        user-select: none;
        transition: opacity 0.2s ease, visibility 0.2s ease;
      }

      .swipe-indicator {
        width: 120px;
        height: 6px;
        border-radius: 999px;
        background: rgba(255,255,255,1);
        position: relative;
        overflow: hidden;
      }

      .swipe-indicator::before {
        content: "";
        position: absolute;
        inset: 0;
        width: 100%;
        background: rgba(255,255,255,1);
      }

      .passcode-panel {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        width: 250px;
        bottom: 34px;
        background: transparent;
        border: none;
        border-radius: 0;
        backdrop-filter: none;
        padding: 0;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.25s ease, transform 0.25s ease, visibility 0.25s ease;
      }

      .passcode-panel.visible {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
        visibility: visible;
      }

      .passcode-label {
        font-size: 12px;
        letter-spacing: 0.16em;
        font-weight: 500;
        color: rgba(255,255,255,0.72);
        text-align: center;
        text-transform: uppercase;
        margin-bottom: 12px;
      }

      .passcode-dot-row {
        display: flex;
        justify-content: center;
        gap: 12px;
        margin: 0 0 20px;
      }

      .pin-dot {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: rgba(255,255,255,0.18);
        border: 1px solid rgba(255,255,255,0.12);
        transition: background 0.15s ease, transform 0.15s ease;
      }

      .pin-dot.filled {
        background: rgba(255,255,255,0.96);
        transform: scale(1.09);
      }

      .keypad {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px 16px;
        justify-items: center;
        align-content: center;
      }

      .key {
        appearance: none;
        border: 0;
        width: 66px;
        height: 66px;
        border-radius: 50%;
        background: rgba(255,255,255,0.06);
        color: #fff;
        font-size: 20px;
        font-weight: 500;
        cursor: pointer;
        display: grid;
        place-items: center;
      }

      .key:active {
        transform: scale(0.98);
      }

      .key.action {
        background: rgba(255,255,255,0.12);
        font-size: 12px;
        letter-spacing: 0.03em;
      }

      .key.spacer {
        visibility: hidden;
        pointer-events: none;
      }

      .home-screen {
        position: absolute;
        inset: 0;
        z-index: 10;
        background: linear-gradient(180deg, #dfe9f3 0%, #c7d6f2 38%, #b8c5ef 100%);
        opacity: 0;
        visibility: hidden;
        transform: translateY(100%);
        transition: transform 0.5s ease, opacity 0.3s ease, visibility 0.3s ease;
      }

      .home-screen.visible {
        opacity: 1;
        visibility: visible;
        transform: translateY(0);
      }

      .home-screen::before {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 20% 20%, rgba(255,255,255,0.5), transparent 30%),
                    radial-gradient(circle at 80% 30%, rgba(255,255,255,0.25), transparent 28%),
                    linear-gradient(180deg, rgba(255,255,255,0.03), rgba(0,0,0,0.04));
      }

      .home-app-grid {
        position: absolute;
        inset: 94px 20px 78px;
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        grid-auto-rows: 68px;
        gap: 18px 14px;
        z-index: 1;
      }

      .app-icon {
        border-radius: 18px;
        background: rgba(255,255,255,0.18);
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.25);
      }

      .app-icon:nth-child(2n) {
        background: rgba(255,255,255,0.12);
      }

      .home-dock {
        position: absolute;
        left: 12px;
        right: 12px;
        bottom: 16px;
        height: 52px;
        border-radius: 18px;
        background: rgba(255,255,255,0.12);
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.18);
        z-index: 1;
      }

      .unlock-success {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 18px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.35s ease, visibility 0.35s ease;
        background: rgba(255,255,255,0.03);
      }

      .unlock-success.visible {
        opacity: 1;
        visibility: visible;
      }

      .home-indicator {
        position: absolute;
        bottom: 8px;
        left: 50%;
        transform: translateX(-50%);
        width: 120px;
        height: 4px;
        border-radius: 999px;
        background: rgba(255,255,255,0.9);
        z-index: 30;
      }

      @media (max-width: 420px) {
        .phone-shell {
          width: 100vw;
          height: 100vh;
          border-radius: 0;
          padding: 0;
          background: #f4f4f4;
        }

        .phone {
          border-radius: 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="phone-shell">
      <div class="phone">
        <div class="notch"></div>

        <div class="screen">
          <div class="status-bar">
            <span>9:41</span>
            <div class="status-icons">
              <span class="signal"></span>
              <span class="wifi"><span></span></span>
              <span class="battery"></span>
            </div>
          </div>
        </div>

        <div class="home-screen" id="homeScreen">
          <div class="home-app-grid">
            <div class="app-icon"></div>
            <div class="app-icon"></div>
            <div class="app-icon"></div>
            <div class="app-icon"></div>
            <div class="app-icon"></div>
            <div class="app-icon"></div>
            <div class="app-icon"></div>
            <div class="app-icon"></div>
          </div>
          <div class="home-dock"></div>
        </div>

        <div class="lock-screen" id="lockScreen">
          <div class="lock-top">
            <div class="lock-time" id="time">9:41</div>
            <div class="lock-date">금요일, 12월 30일</div>
          </div>

          <div class="swipe-zone" id="swipeZone">
            <div class="swipe-indicator"></div>
          </div>

          <div class="passcode-panel" id="passcodePanel">
            <div class="passcode-label">암호 입력</div>
            <div class="passcode-dot-row" id="passcodeDots"></div>
            <div class="keypad">
              <button class="key" type="button">1</button>
              <button class="key" type="button">2</button>
              <button class="key" type="button">3</button>
              <button class="key" type="button">4</button>
              <button class="key" type="button">5</button>
              <button class="key" type="button">6</button>
              <button class="key" type="button">7</button>
              <button class="key" type="button">8</button>
              <button class="key" type="button">9</button>
              <button class="key action" type="button" id="clearPasscode">삭제</button>
              <button class="key" type="button">0</button>
              <div class="key spacer" aria-hidden="true"></div>
            </div>
          </div>

          <div class="unlock-success" id="unlockSuccess">Unlocked</div>
        </div>

        <div class="home-indicator"></div>
      </div>
    </div>

    <script>
      const timeEl = document.getElementById('time');
      const updateClock = () => {
        const now = new Date();
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        timeEl.textContent = `${hours}:${minutes}`;
      };
      updateClock();
      setInterval(updateClock, 30000);

      const lockScreen = document.getElementById('lockScreen');
      const passcodePanel = document.getElementById('passcodePanel');
      const passcodeDots = document.getElementById('passcodeDots');
      const unlockSuccess = document.getElementById('unlockSuccess');
      const swipeZone = document.getElementById('swipeZone');
      const homeScreen = document.getElementById('homeScreen');
      const keypadButtons = Array.from(document.querySelectorAll('.key'));
      let enteredCode = '';
      let touchStartY = 0;
      let swipeActive = false;

      const renderDots = () => {
        passcodeDots.innerHTML = '';
        for (let i = 0; i < 4; i += 1) {
          const dot = document.createElement('span');
          dot.className = 'pin-dot' + (i < enteredCode.length ? ' filled' : '');
          passcodeDots.appendChild(dot);
        }
      };

      const showPasscode = () => {
        passcodePanel.classList.add('visible');
        lockScreen.classList.add('passcode-visible');
      };

      const hidePasscode = () => {
        passcodePanel.classList.remove('visible');
        lockScreen.classList.remove('passcode-visible');
      };

      const unlockPhone = () => {
        hidePasscode();
        lockScreen.classList.add('hidden');
        homeScreen.classList.add('visible');
      };

      const resetPasscode = () => {
        enteredCode = '';
        renderDots();
      };

      const handleNumberInput = (value) => {
        if (enteredCode.length >= 4) return;
        enteredCode += value;
        renderDots();

        if (enteredCode.length === 4) {
          setTimeout(() => {
            unlockPhone();
            resetPasscode();
          }, 180);
        }
      };

      keypadButtons.forEach((button) => {
        const value = button.textContent.trim();

        if (button.id === 'clearPasscode') {
          button.addEventListener('click', () => {
            enteredCode = enteredCode.slice(0, -1);
            renderDots();
          });
          return;
        }

        if (button.classList.contains('spacer')) {
          return;
        }

        if (/^[0-9]$/.test(value)) {
          button.addEventListener('click', () => handleNumberInput(value));
        }
      });

      swipeZone.addEventListener('touchstart', (event) => {
        touchStartY = event.touches[0].clientY;
        swipeActive = true;
      }, { passive: true });

      swipeZone.addEventListener('touchmove', (event) => {
        if (!swipeActive) return;
        const deltaY = touchStartY - event.touches[0].clientY;
        if (deltaY > 40) {
          showPasscode();
          swipeActive = false;
        }
      }, { passive: true });

      swipeZone.addEventListener('mousedown', (event) => {
        touchStartY = event.clientY;
        swipeActive = true;
      });

      swipeZone.addEventListener('mousemove', (event) => {
        if (!swipeActive) return;
        const deltaY = touchStartY - event.clientY;
        if (deltaY > 40) {
          showPasscode();
          swipeActive = false;
        }
      });

      swipeZone.addEventListener('mouseup', () => {
        swipeActive = false;
      });

      swipeZone.addEventListener('mouseleave', () => {
        swipeActive = false;
      });

      renderDots();
    </script>
  </body>
</html>
