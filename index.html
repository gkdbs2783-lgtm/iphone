<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>iPhone Lock Screen Mockup</title>
    <style>
      :root {
        --bg: #000000;
        --phone-frame: #0d0d0d;
        --glass: rgba(255, 255, 255, 0.08);
        --text: #f5f5f5;
        --muted: rgba(255,255,255,0.68);
        --line: rgba(255,255,255,0.18);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        width: 100%;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
      }

      body {
        display: grid;
        place-items: center;
        overflow: hidden;
      }

      .phone-shell {
        width: min(82vw, 340px);
        height: min(92vh, 700px);
        padding: 12px 12px 16px;
        border-radius: 38px;
        background: linear-gradient(145deg, #1a1a1a, #050505 45%, #121212 100%);
        box-shadow: 0 30px 60px rgba(0,0,0,0.55);
        position: relative;
      }

      .phone-shell::before {
        content: "";
        position: absolute;
        inset: 8px 8px auto 8px;
        height: 22px;
        border-radius: 16px;
        background: rgba(0,0,0,0.28);
        filter: blur(8px);
      }

      .phone {
        position: relative;
        width: 100%;
        height: 100%;
        border-radius: 32px;
        overflow: hidden;
        background: #000;
        border: 1px solid rgba(255,255,255,0.08);
      }

      .screen {
        position: relative;
        z-index: 1;
        width: 100%;
        height: 100%;
        background: #000;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        padding: 18px 18px 20px;
      }

      .status-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 12px;
        font-weight: 600;
        color: rgba(255,255,255,0.9);
        padding: 0 8px 6px;
      }

      .status-icons {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .signal {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: rgba(255,255,255,0.95);
      }

      .wifi {
        width: 14px;
        height: 10px;
        position: relative;
      }

      .wifi::before,
      .wifi::after,
      .wifi span {
        content: "";
        position: absolute;
        inset: 0;
        border: 2px solid rgba(255,255,255,0.9);
        border-color: rgba(255,255,255,0.9) transparent transparent transparent;
        border-radius: 50%;
      }

      .wifi::before { transform: scale(0.65); }
      .wifi::after { transform: scale(0.35); }
      .wifi span { transform: scale(0.15); }

      .battery {
        width: 20px;
        height: 10px;
        border-radius: 3px;
        border: 1.5px solid rgba(255,255,255,0.9);
        position: relative;
      }

      .battery::before {
        content: "";
        position: absolute;
        right: -4px;
        top: 2px;
        width: 2px;
        height: 5px;
        background: rgba(255,255,255,0.9);
        border-radius: 2px;
      }

      .battery::after {
        content: "";
        position: absolute;
        inset: 2px;
        background: rgba(255,255,255,0.92);
        border-radius: 2px;
      }

      .notch {
        position: absolute;
        top: 8px;
        left: 50%;
        transform: translateX(-50%);
        width: 132px;
        height: 26px;
        border-radius: 18px;
        background: rgba(0,0,0,0.9);
        z-index: 20;
      }

      .notch::before {
        content: "";
        position: absolute;
        inset: 8px 52px 8px 52px;
        border-radius: 8px;
        background: rgba(20,20,20,0.9);
      }

      .lock-screen {
        position: absolute;
        inset: 0;
        z-index: 40;
        background: #000;
        padding: 58px 26px 36px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      .lock-top {
        text-align: center;
      }

      .lock-time {
        font-size: 62px;
        font-weight: 300;
        letter-spacing: -0.08em;
        line-height: 1;
        color: #fff;
      }

      .lock-date {
        margin-top: 10px;
        color: rgba(255,255,255,0.72);
        font-size: 14px;
      }

      .lock-hint {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 90px;
        color: rgba(255,255,255,0.65);
        font-size: 12px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .lock-hint::before {
        content: "";
        width: 120px;
        height: 6px;
        border-radius: 999px;
        background: rgba(255,255,255,0.9);
        display: block;
        margin-right: 12px;
      }

      .home-indicator {
        position: absolute;
        bottom: 8px;
        left: 50%;
        transform: translateX(-50%);
        width: 120px;
        height: 4px;
        border-radius: 999px;
        background: rgba(255,255,255,0.9);
        z-index: 30;
      }

      @media (max-width: 420px) {
        .phone-shell {
          width: 100vw;
          height: 100vh;
          border-radius: 0;
          padding: 0;
          background: #000;
        }

        .phone {
          border-radius: 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="phone-shell">
      <div class="phone">
        <div class="notch"></div>

        <div class="screen">
          <div class="status-bar">
            <span id="statusTime">9:41</span>
            <div class="status-icons">
              <span class="signal"></span>
              <span class="wifi"><span></span></span>
              <span class="battery"></span>
            </div>
          </div>
        </div>

        <div class="lock-screen">
          <div class="lock-top">
            <div class="lock-time" id="time">9:41</div>
            <div class="lock-date">금요일, 12월 30일</div>
          </div>

          <div class="lock-hint">Slide to unlock</div>
        </div>

        <div class="home-indicator"></div>
      </div>
    </div>

    <script>
      const timeEl = document.getElementById('time');
      const statusTimeEl = document.getElementById('statusTime');
      const updateClock = () => {
        const now = new Date();
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        const value = `${hours}:${minutes}`;
        timeEl.textContent = value;
        statusTimeEl.textContent = value;
      };
      updateClock();
      setInterval(updateClock, 30000);
    </script>
  </body>
</html>
