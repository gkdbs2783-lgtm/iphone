<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>iPhone Lock Screen</title>
    <style>
      :root {
        --bg: #000000;
        --text: rgba(255,255,255,0.76);
        --icon: rgba(255,255,255,0.9);
        --gray: rgba(255,255,255,0.7);
        --glass: rgba(255,255,255,0.08);
        --glass-strong: rgba(255,255,255,0.12);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: var(--bg);
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
      }

      body {
        display: grid;
        place-items: center;
        overflow: hidden;
      }

      .phone-shell {
        width: min(82vw, 340px);
        height: min(92vh, 700px);
        padding: 12px 12px 16px;
        border-radius: 38px;
        background: linear-gradient(145deg, #141414, #040404 50%, #111111 100%);
        box-shadow: 0 30px 60px rgba(0,0,0,0.55);
        position: relative;
      }

      .phone-shell::before {
        content: "";
        position: absolute;
        inset: 8px 8px auto 8px;
        height: 22px;
        border-radius: 16px;
        background: rgba(0,0,0,0.28);
        filter: blur(8px);
      }

      .phone {
        position: relative;
        width: 100%;
        height: 100%;
        border-radius: 32px;
        overflow: hidden;
        background: var(--bg);
        border: 1px solid rgba(255,255,255,0.08);
      }

      .notch {
        position: absolute;
        top: 8px;
        left: 50%;
        transform: translateX(-50%);
        width: 132px;
        height: 26px;
        border-radius: 18px;
        background: rgba(0,0,0,0.9);
        z-index: 40;
      }

      .notch::before {
        content: "";
        position: absolute;
        inset: 8px 52px 8px 52px;
        border-radius: 8px;
        background: rgba(16,17,18,0.9);
      }

      .screen {
        position: absolute;
        inset: 0;
        background: #000;
        z-index: 1;
      }

      .status-bar {
        position: absolute;
        top: 18px;
        left: 0;
        right: 0;
        padding: 0 18px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        z-index: 50;
      }

      .carrier {
        font-size: 18px;
        font-weight: 700;
        letter-spacing: -0.04em;
        color: rgba(255,255,255,0.92);
      }

      .status-icons {
        display: flex;
        align-items: center;
        gap: 8px;
        color: rgba(255,255,255,0.9);
      }

      .signal {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: rgba(255,255,255,0.95);
      }

      .wifi {
        width: 16px;
        height: 12px;
        position: relative;
      }

      .wifi::before,
      .wifi::after,
      .wifi span {
        content: "";
        position: absolute;
        inset: 0;
        border: 2px solid rgba(255,255,255,0.9);
        border-color: rgba(255,255,255,0.9) transparent transparent transparent;
        border-radius: 50%;
      }

      .wifi::before { transform: scale(0.7); }
      .wifi::after { transform: scale(0.42); }
      .wifi span { transform: scale(0.15); }

      .battery-wrap {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .battery-value {
        font-size: 14px;
        font-weight: 700;
        color: rgba(255,255,255,0.9);
      }

      .battery {
        position: relative;
        width: 26px;
        height: 12px;
        border-radius: 3px;
        border: 1.5px solid rgba(255,255,255,0.9);
      }

      .battery::before {
        content: "";
        position: absolute;
        right: -4px;
        top: 2px;
        width: 2px;
        height: 6px;
        border-radius: 2px;
        background: rgba(255,255,255,0.9);
      }

      .battery::after {
        content: "";
        position: absolute;
        inset: 2px 2px 2px 2px;
        border-radius: 2px;
        background: rgba(255,255,255,0.9);
      }

      .lock-screen {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        padding-top: 72px;
        color: rgba(255,255,255,0.8);
      }

      .lock-pin {
        width: 28px;
        height: 32px;
        position: relative;
        margin-bottom: 18px;
      }

      .lock-pin::before {
        content: "";
        position: absolute;
        left: 50%;
        top: 6px;
        transform: translateX(-50%);
        width: 18px;
        height: 18px;
        border: 4px solid rgba(255,255,255,0.9);
        border-top: 0;
        border-radius: 6px;
      }

      .lock-pin::after {
        content: "";
        position: absolute;
        left: 50%;
        bottom: 2px;
        transform: translateX(-50%);
        width: 11px;
        height: 12px;
        border-radius: 50% 50% 42% 42%;
        border: 4px solid rgba(255,255,255,0.9);
        border-top: 0;
        border-left-width: 3px;
        border-right-width: 3px;
      }

      .date-label {
        font-size: 20px;
        font-weight: 600;
        letter-spacing: -0.02em;
        color: rgba(255,255,255,0.9);
        margin-bottom: 12px;
      }

      .time {
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 160px;
        line-height: 0.8;
        letter-spacing: -0.09em;
        font-weight: 300;
        color: rgba(255,255,255,0.78);
        margin-top: 6px;
      }

      .time .digit {
        display: inline-block;
        width: 1ch;
        text-align: center;
      }

      .time .colon {
        position: relative;
        display: inline-flex;
        width: 22px;
        justify-content: center;
        align-items: center;
        height: 130px;
      }

      .time .colon::before,
      .time .colon::after {
        content: "";
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        width: 12px;
        height: 12px;
        background: rgba(255,255,255,0.79);
        border-radius: 50%;
      }

      .time .colon::before { top: 25px; }
      .time .colon::after { bottom: 25px; }

      .tool-row {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 30px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 26px;
        z-index: 60;
      }

      .tool {
        width: 82px;
        height: 82px;
        border-radius: 50%;
        background: rgba(255,255,255,0.08);
        position: relative;
      }

      .flash::before {
        content: "";
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 26px;
        height: 26px;
        background: rgba(255,255,255,0.95);
        clip-path: polygon(47% 0%, 60% 28%, 84% 28%, 66% 48%, 80% 100%, 47% 70%, 18% 100%, 32% 48%, 14% 28%, 41% 28%);
      }

      .camera::before {
        content: "";
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 28px;
        height: 20px;
        border: 3px solid rgba(255,255,255,0.9);
        border-radius: 8px;
        background: transparent;
      }

      .camera::after {
        content: "";
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: rgba(255,255,255,0.9);
        box-shadow: 0 0 0 2px rgba(255,255,255,0.12);
      }

      .night-mode {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 16px;
        color: rgba(255,255,255,0.9);
        font-weight: 500;
        min-width: 140px;
        justify-content: center;
      }

      .moon {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: rgba(255,255,255,0.9);
        position: relative;
        box-shadow: inset -5px 0 0 rgba(0,0,0,0.9);
      }

      .home-indicator {
        position: absolute;
        bottom: 8px;
        left: 50%;
        transform: translateX(-50%);
        width: 140px;
        height: 4px;
        border-radius: 999px;
        background: rgba(255,255,255,0.9);
        z-index: 70;
      }

      @media (max-width: 420px) {
        .phone-shell {
          width: 100vw;
          height: 100vh;
          border-radius: 0;
          padding: 0;
          background: #000;
        }

        .phone {
          border-radius: 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="phone-shell">
      <div class="phone">
        <div class="notch"></div>

        <div class="screen">
          <div class="status-bar">
            <div class="carrier">KT</div>
            <div class="status-icons">
              <span class="signal"></span>
              <span class="wifi"><span></span></span>
              <div class="battery-wrap">
                <span class="battery-value">67</span>
                <span class="battery"></span>
              </div>
            </div>
          </div>

          <div class="lock-screen">
            <div class="lock-pin"></div>
            <div class="date-label">10월 25일 (일)</div>
            <div class="time" aria-label="8:39">
              <span class="digit">8</span>
              <span class="colon"></span>
              <span class="digit">3</span>
              <span class="digit">9</span>
            </div>
          </div>

          <div class="tool-row">
            <div class="tool flash" aria-label="flashlight"></div>
            <div class="night-mode"><span class="moon"></span> 밤해금 모드</div>
            <div class="tool camera" aria-label="camera"></div>
          </div>

          <div class="home-indicator"></div>
        </div>
      </div>
    </div>
  </body>
</html>
